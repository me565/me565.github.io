<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Moth House: Packing day (draft)</title>
<meta name="theme-color" content="#f3eadb">
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Rough draft of the children's version: Prologue, Packing day (see STORY.md). */
:root{
  --bg:#edf1e7;--ink:#1d2629;--muted:#55635d;--slot:#dde4d6;--accent:#c98320;
  --mary:#7a5cc2;--elliot:#d0602f;--zaina:#2f8a57;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#141a28;--ink:#e8ecef;--muted:#9ea9b8;--slot:#232c40;--accent:#f0b44c;--mary:#a58ae6;--elliot:#ef8a5a;--zaina:#5fc08a}
}
:root[data-theme="dark"]{--bg:#141a28;--ink:#e8ecef;--muted:#9ea9b8;--slot:#232c40;--accent:#f0b44c;--mary:#a58ae6;--elliot:#ef8a5a;--zaina:#5fc08a}
html{height:100%;overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",Verdana,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{height:100%;max-width:clamp(460px,calc((100dvh - 290px) * .75 + 32px),640px);margin:0 auto;padding:6px 16px 10px;display:flex;flex-direction:column}
header{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-family:Caprasimo,"Cooper Black",Georgia,serif;font-weight:400;font-size:clamp(1.1rem,4dvh,1.6rem);margin:4px 0 6px;line-height:1.1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;gap:4px;align-items:center;flex:none}
@media (max-width:370px){.hint .t{display:none}.hint{padding:4px 8px}h1{font-size:1.05rem}.long{display:none}}
@media (min-width:371px){.short{display:none}}
.link{white-space:nowrap;background:none;border:0;color:var(--muted);font:inherit;font-size:.95rem;cursor:pointer;padding:8px 4px;min-height:44px}
.hint{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--accent);color:var(--ink);border-radius:999px;font:inherit;font-size:.9rem;padding:4px 12px 4px 6px;min-height:40px;cursor:pointer}
.hint svg{width:30px;height:20px}
button:focus-visible,.hs:focus-visible .hit{outline:3px solid var(--accent);outline-offset:2px}
.stagebox{flex:1 1 0;min-height:0;container-type:size;display:flex;justify-content:center;align-items:center}
.stage{width:min(100cqw,75cqh);aspect-ratio:3/4;container-type:inline-size;position:relative;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.15),0 10px 30px -14px rgba(0,0,0,.4)}
.stage>svg{display:block;width:100%;height:auto;touch-action:manipulation}
.panel{flex:none}
.kids{display:flex;gap:8px;margin-top:8px}
.kid{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:999px;border:2px solid transparent;background:var(--slot);color:var(--ink);font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;padding:4px 8px}
.kid i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:.85rem;flex:none}
.kid[data-k="mary"] i{background:var(--mary)} .kid[data-k="elliot"] i{background:var(--elliot)} .kid[data-k="zaina"] i{background:var(--zaina)}
.kid[aria-pressed="true"][data-k="mary"]{border-color:var(--mary)}
.kid[aria-pressed="true"][data-k="elliot"]{border-color:var(--elliot)}
.kid[aria-pressed="true"][data-k="zaina"]{border-color:var(--zaina)}
.msg{height:4.2em;overflow:hidden;margin:8px 2px;font-size:clamp(.92rem,2.3dvh,1.05rem);line-height:1.4}
.msg b{font-weight:700}
.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{height:clamp(48px,8.5dvh,80px);background:var(--slot);border:0;border-radius:10px;display:grid;place-items:center;padding:6px;cursor:pointer;font:inherit;color:inherit}
.slot:disabled{cursor:default}
.slot[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--accent)}
.slot svg{width:100%;height:100%}
.hs{cursor:pointer}
.hs:focus{outline:none}
.off{display:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(8px,3cqw,14px);padding:clamp(12px,6cqw,28px);font-size:clamp(13px,4.4cqw,17px)}
.overlay[hidden]{display:none}
.end{background:linear-gradient(#8fb8d6,#dcebf2 60%,#fff);color:#1d2629}
.end p{margin:0;max-width:28ch;line-height:1.45}
.end .big{font-family:Caprasimo,"Cooper Black",Georgia,serif;font-size:1.5em}
.end .next{font-size:.9em;color:#3d4b52}
.end button{font:inherit;min-height:44px;padding:.4em 1em;border-radius:999px;border:2px solid #1d2629;background:#fff;color:#1d2629;cursor:pointer}
.fade{opacity:0;animation:fadein 1.2s ease forwards}
@keyframes fadein{to{opacity:1}}
#rain{animation:rain .9s linear infinite}
@keyframes rain{from{transform:translateY(-12px)}to{transform:translateY(0)}}
#blades{transform-origin:180px 22px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#planeGo{animation:fly 6s ease-in-out forwards}
@keyframes fly{from{transform:translate(-40px,40px)}to{transform:translate(40px,-30px)}}
@media (max-height:520px){.kid span{display:none}}
@media (orientation:landscape) and (max-height:620px){
  main{max-width:900px;display:grid;grid-template-columns:auto minmax(220px,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:18px}
  header{grid-column:1/-1}
  .stagebox{height:100%;aspect-ratio:3/4}
  .panel{align-self:center}
  .msg{height:auto;max-height:8.4em}
}
@media (prefers-reduced-motion:reduce){
  #rain,#blades,#planeGo{animation:none}
  .fade{animation:none;opacity:1}
}
</style>
</head>
<body>
<main>
<header>
  <h1>The Moth House</h1>
  <div class="hbtns">
    <button class="hint" id="hintBtn" aria-label="Ask the moth for a hint">
      <svg viewBox="-14 -10 28 20" aria-hidden="true"><path d="M0 0C-4-9-13-9-13-2-13 3-5 3 0 0Z" fill="#f0b44c"/><path d="M0 0C4-9 13-9 13-2 13 3 5 3 0 0Z" fill="#f0b44c"/><path d="M0 1C-3 7-9 8-9 4-9 1-4 1 0 1Z" fill="#e9b98a"/><path d="M0 1C3 7 9 8 9 4 9 1 4 1 0 1Z" fill="#e9b98a"/><ellipse cx="0" cy="1" rx="1.3" ry="5" fill="#2b3431"/></svg>
      <span class="t">Hint</span>
    </button>
    <button class="link" id="restart" aria-label="Start over"><span class="long">Start over</span><span class="short">Restart</span></button>

<div class="stagebox">

</defs>

<!-- room -->

<!-- window with rain -->

<g class="hs pmoth" data-id="m5" role="button" tabindex="0" aria-label="Something small on the window sill"><use href="#pm" x="118" y="164" width="14" height="10"/><rect class="hit" x="110" y="158" width="30" height="20" fill="transparent"/></g>
<g class="hs pmoth" data-id="m6" role="button" tabindex="0" aria-label="Something small by the fridge"><use href="#pm" x="300" y="348" width="14" height="10"/><rect class="hit" x="292" y="342" width="30" height="20" fill="transparent"/></g>
</svg>

<div class="overlay end" id="endUI" hidden>
  <svg viewBox="0 0 200 80" width="60%" aria-hidden="true"><g id="planeGo"><path d="M20 50 70 44 100 18h12L96 44l40-3 12-14h9l-6 22 6 22h-9l-12-14-40-3 16 26h-12L70 54 20 50Z" fill="#fffdf8" stroke="#5b6f7a" stroke-width="2" stroke-linejoin="round"/></g></svg>
  <p class="fade big" style="animation-delay:.2s">Off to London!</p>
  <p class="fade" style="animation-delay:1.4s">The plane rises through the rain and into the sunshine above the clouds.</p>
  <p class="fade" style="animation-delay:3s">Back home on the fridge, the moth on Nana's postcard flickers, just once.</p>
  <p class="fade next" id="endMoths" style="animation-delay:4.4s"></p>
  <p class="fade next" style="animation-delay:5.2s">Next: Chapter 1, Nana and Jedi's. Coming soon.</p>
  <button class="fade" id="again" style="animation-delay:6s">Play again</button>
</div>
</div>
</div>

<div class="panel">
  <div class="kids" id="kids" role="group" aria-label="Who is playing">
    <button class="kid" data-k="mary"><i>M</i><span>Mary</span></button>
    <button class="kid" data-k="elliot"><i>E</i><span>Elliot</span></button>
    <button class="kid" data-k="zaina"><i>Z</i><span>Zaina</span></button>
  </div>
  <p class="msg" id="msg" aria-live="polite"></p>
  <div class="inv" id="inv" aria-label="Things you are carrying"></div>
</div>
</main>

<script>
const $ = id => document.getElementById(id);
// Talents are placeholders until the owner decides (STORY.md, open decisions).
const KIDS = {
  mary:{name:'Mary', talent:'good at reading tricky writing'},
  elliot:{name:'Elliot', talent:'good at fixing things'},
  zaina:{name:'Zaina', talent:'great at spotting tiny things'}
};
const ITEMS = {
  key:{name:'desk key', icon:'<svg viewBox="0 0 40 40"><circle cx="13" cy="20" r="7" fill="none" stroke="#c9a24a" stroke-width="4"/><path d="M20 18h16v4h-3v5h-4v-5h-3v4h-4v-4h-2z" fill="#c9a24a"/></svg>'},
  torch:{name:'little torch', icon:'<svg viewBox="0 0 40 40"><rect x="6" y="15" width="20" height="10" rx="3" fill="#2f7c83"/><path d="M26 13h6l3-3v20l-3-3h-6z" fill="#5b6f7a"/><path d="M36 14l3-2M36 20h3M36 26l3 2" stroke="#f0b44c" stroke-width="2"/></svg>'},
  passports:{name:'passports', icon:'<svg viewBox="0 0 40 40"><rect x="12" y="6" width="20" height="28" rx="2" fill="#8a2f3a"/><rect x="9" y="8" width="20" height="28" rx="2" fill="#a33a46"/><rect x="6" y="10" width="20" height="26" rx="2" fill="#b8434f"/><circle cx="16" cy="21" r="4" fill="none" stroke="#f0d28a" stroke-width="1.5"/></svg>'},
  kaya:{name:'jar of kaya', icon:'<svg viewBox="0 0 40 40"><rect x="10" y="13" width="20" height="21" rx="4" fill="#d9b25a"/><rect x="8" y="7" width="24" height="8" rx="2" fill="#3b8a4e"/><rect x="13" y="19" width="14" height="8" fill="#fffdf8"/></svg>'},
  present:{name:"Nana's present", icon:'<svg viewBox="0 0 40 40"><defs><pattern id="gp2" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#7fb5c9"/><circle cx="4" cy="4" r="1.5" fill="#f0b44c"/></pattern></defs><rect x="7" y="14" width="26" height="20" rx="2" fill="url(#gp2)"/><rect x="18" y="14" width="4" height="20" fill="#d0602f"/><path d="M20 14c-4-6-10-4-6 0M20 14c4-6 10-4 6 0" stroke="#d0602f" stroke-width="2.5" fill="none"/></svg>'}
};
// Which item may be used on which thing.
const USES = {key:'desk', kaya:'paper', torch:'suitcase', passports:'suitcase', present:'suitcase'};
const PACK = ['torch','passports','present'];

let S;
function fresh(){
  S = {who:'mary', read:false, gotTorch:false, gotKey:false, unlocked:false, gotPassports:false, gotKaya:false, wrapped:false,
       packed:[], moths:[], inv:[], sel:null, done:false, hint:{}};
}
const say = t => { $('msg').innerHTML = t; };
const tog = (id, show) => $(id).classList.toggle('off', !show);
const add = it => S.inv.push(it);
const use = it => { S.inv = S.inv.filter(x => x !== it); };
const kid = () => KIDS[S.who].name;

function render(){
  tog('deskKey', !S.gotKey);
  tog('drawerOpen', S.gotPassports);
  tog('jarArt', !S.gotKaya);
  tog('caseOpen', !S.done); tog('caseShut', S.done);
  document.querySelectorAll('.pmoth').forEach(g => g.classList.toggle('off', S.moths.includes(g.dataset.id)));
  $('packed').innerHTML = S.packed.map((it, i) =>
    `<svg x="${128 + i*38}" y="386" width="34" height="34" viewBox="0 0 40 40">${ITEMS[it].icon.replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg>`).join('');
  document.querySelectorAll('.kid').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === S.who ? 'true' : 'false'));
  const inv = $('inv'); inv.innerHTML = '';
  for (let i = 0; i < 4; i++){
    const it = S.inv[i];
    const b = document.createElement('button');
    b.className = 'slot';
    if (it){
      b.innerHTML = ITEMS[it].icon;
      b.setAttribute('aria-label', ITEMS[it].name);
      b.setAttribute('aria-pressed', S.sel === it ? 'true' : 'false');
      b.onclick = () => {
        S.sel = S.sel === it ? null : it;
        if (S.sel) say(`You're holding the ${ITEMS[it].name}. Where should it go?`);
        render();
      };
    } else { b.disabled = true; b.setAttribute('aria-label', 'Empty'); }
    inv.appendChild(b);
  }
}

function stillToPack(){
  const need = [];
  if (!S.packed.includes('passports')) need.push('the passports');
  if (!S.packed.includes('present')) need.push('a present for Nana');
  if (!S.packed.includes('torch')) need.push(S.read ? 'the little torch' : 'whatever Nana asked for');
  return need;
}
const list = a => a.length === 1 ? a[0] : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];

function act(id){
  if (S.done) return;
  const item = S.sel;
  S.sel = null;
  if (item && USES[item] !== id){
    say(`The ${ITEMS[item].name} doesn't go there. Try somewhere else!`); render(); return;
  }
  if (/^m\d$/.test(id)){
    if (!S.moths.includes(id)){
      S.moths.push(id);
      const n = S.moths.length;
      say(n === 6 ? 'That’s all six paper moths! Nana will be very impressed.'
                  : `A tiny paper moth, folded from Nana's letter paper! That's ${n} of 6.`);
    }
    render(); return;
  }
  switch(id){
    case 'postcard':
      if (S.read) say('“Bring the little torch, you’ll need it! P.S. I’ve run out of kaya.” The moth in the corner seems to shimmer.');
      else if (S.who === 'mary'){ S.read = true; say('Mary reads: “Bring the little torch, you’ll need it! P.S. I’ve run out of kaya.” A moth is doodled in the corner.'); }
      else say(`A postcard from Nana, but her joined-up writing is too loopy for ${kid()}. Mary is good at reading tricky writing.`);
      break;
    case 'boots':
      if (S.gotTorch) say('Mum’s yellow rain boots. Just boots now.');
      else if (!S.read) say('Mum’s yellow rain boots, still wet from this morning.');
      else if (S.who === 'zaina'){ S.gotTorch = true; add('torch'); say('Zaina spots something shiny, deep inside a boot. It’s the little torch!'); }
      else say(`Is something in there? ${kid()} can’t quite see. Zaina is great at spotting tiny things.`);
      break;
    case 'keys':
      if (S.gotKey) say('Just the spare door keys now.');
      else { S.gotKey = true; add('key'); say('A little brass key with a paper tag. The tag says: DESK.'); }
      break;
    case 'desk':
      if (S.gotPassports) say('Dad’s desk, tidy for once.');
      else if (!S.unlocked){
        if (item === 'key'){ S.unlocked = true; use('key'); say('The key turns with a click. But the drawer is stuck!'); }
        else say('Dad keeps the passports in this drawer. It’s locked, and it needs a small key.');
      }
      else if (S.who === 'elliot'){ S.gotPassports = true; add('passports'); say('Elliot lifts the drawer and gives it a wiggle, just like Dad does. It slides open: the passports!'); }
      else say(`The drawer is stuck and ${kid()} can’t shift it. Elliot is good at fixing things.`);
      break;
    case 'jar':
      if (S.gotKaya) say('A gap on the shelf where the kaya was.');
      else if (!S.read) say('A jar of kaya, sweet coconut jam. Which present would Nana like best? Maybe her postcard says.');
      else { S.gotKaya = true; add('kaya'); say(`Nana has run out of kaya! ${kid()} takes the jar down from the shelf.`); }
      break;
    case 'globe': say('A snow globe with a tiny durian inside. Nana says durians are far too smelly for her.'); break;
    case 'orchid': say('A purple orchid. Lovely, but it wouldn’t like thirteen hours on a plane.'); break;
    case 'paper':
      if (item === 'kaya'){ S.wrapped = true; use('kaya'); add('present'); say('You wrap the kaya in paper covered in little moths, and add a bow. Perfect!'); }
      else say('A roll of wrapping paper with a pattern of little moths.');
      break;
    case 'suitcase':
      if (PACK.includes(item)){
        S.packed.push(item); use(item);
        const need = stillToPack();
        if (!need.length){ finish(); return; }
        say(`In ${item === 'passports' ? 'go' : 'goes'} the ${ITEMS[item].name}. Still to pack: ${list(need)}.`);
      } else say(`Summer clothes, all folded. Still to pack: ${list(stillToPack())}.`);
      break;
    case 'mum': say('Mum calls from the kitchen: “Passports, a present for Nana, and whatever Nana asked for. Suitcase shut by teatime!”'); break;
    case 'window': say('Rain drums on the window. In London it’s summer, and the evenings stay light until late.'); break;
    case 'fan': say('The ceiling fan turns lazily round and round.'); break;
    case 'sofa': say('The comfy sofa. Elliot lost a sock under there once and never found it.'); break;
    case 'fridge': say('Cold drinks, and a fridge magnet shaped like a durian.'); break;
  }
  render();
}

function finish(){
  S.done = true;
  say('The suitcase clicks shut. Mum calls out: “Taxi’s here!”');
  render();
  const n = S.moths.length;
  $('endMoths').textContent = n === 6 ? 'You found all six paper moths!' : `You found ${n} of the 6 hidden paper moths. Can you find them all next time?`;
  setTimeout(() => { $('endUI').hidden = false; }, 1200);
}

/* The moth gives hints: where to look, then what to try, then the answer. */
const HINTS = [
  {goal:() => S.read, tips:[
    'Mum said to bring whatever Nana asked for. Where do families stick their postcards?',
    'Nana’s postcard is on the fridge. Her writing is loopy, so someone good at reading should look.',
    'Tap Mary at the bottom, then tap the postcard on the fridge.']},
  {goal:() => S.gotTorch, tips:[
    'Nana asked for the little torch. Small things like to hide low down, near the floor.',
    'Have a look in Mum’s rain boots. Someone good at spotting tiny things should look.',
    'Tap Zaina at the bottom, then tap the yellow rain boots.']},
  {goal:() => S.gotKey, tips:[
    'Dad keeps the passports locked in his desk. Where would a key hang?',
    'Look above Dad’s desk.',
    'Tap the key hooks on the wall above Dad’s desk.']},
  {goal:() => S.unlocked, tips:[
    'You have Dad’s desk key.',
    'Use the key on Dad’s desk.',
    'Tap the key at the bottom, then tap the desk drawer.']},
  {goal:() => S.gotPassports, tips:[
    'The drawer is stuck. Who in the family is good at fixing things?',
    'Elliot is good at fixing things.',
    'Tap Elliot at the bottom, then tap the desk drawer.']},
  {goal:() => S.gotKaya, tips:[
    'Nana’s postcard has a P.S. What has she run out of?',
    'Nana has run out of kaya. Look on the shelf.',
    'Tap the jar of kaya on the shelf.']},
  {goal:() => S.wrapped, tips:[
    'A present needs wrapping!',
    'There’s wrapping paper on Dad’s desk.',
    'Tap the kaya at the bottom, then tap the wrapping paper.']},
  {goal:() => false, tips:[
    'Everything is ready. Where does it all go?',
    'Put each thing into the suitcase.',
    'Tap each thing at the bottom, then tap the suitcase.']}
];
function hint(){
  if (S.done) return;
  // Pack whatever is ready first, otherwise the first unfinished step.
  const ready = S.inv.some(it => PACK.includes(it));
  const i = ready ? HINTS.length - 1 : HINTS.findIndex(h => !h.goal());
  const level = S.hint[i] = Math.min((S.hint[i] ?? -1) + 1, 2);
  say('<b>The moth whispers:</b> ' + HINTS[i].tips[level]);
}

document.querySelectorAll('.kid').forEach(b => b.onclick = () => {
  S.who = b.dataset.k; S.sel = null;
  say(`Now playing as ${kid()}, who is ${KIDS[S.who].talent}.`);
  render();
});
document.querySelectorAll('.hs').forEach(el => {
  el.addEventListener('click', () => act(el.dataset.id));
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); act(el.dataset.id); } });
});
$('hintBtn').onclick = hint;

function start(){
  fresh();
  $('endUI').hidden = true;
  say('<b>Packing day.</b> School’s out, rain is drumming, and the suitcase must be shut by teatime. Tap things to look closer.');
  render();
}
$('restart').onclick = start;
$('again').onclick = start;
start();
</script>
</body>
</html>
