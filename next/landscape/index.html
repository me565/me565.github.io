<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Moth House (landscape test)</title>
<meta name="theme-color" content="#141a28">
<link rel="icon" href="../../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Landscape engine, first test room: Mary's classroom 5H drawn as generated pictures (see ../art/classroom).
   Layout follows the owner's brief of 28 Sept 2026: a 16:9 scene, small turn arrows halfway up each side,
   the inventory as a strip of slots under the scene, close-ups brought forward over the softened room. */
:root{
  --bg:#141a28; --frame:#0c101a; --ink:#1d2629; --paper:#fffaf0; --muted:#55635d;
  --accent:#c98320; --accent-soft:#f6e6c8; --slot:#e6e1d3; --slot-line:#b9b2a1;
  --u:6px; /* one hundredth of the scene width, set by script */
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",Verdana,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}

#app{height:100%;display:grid;place-items:center;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.stage{width:calc(var(--u) * 100);display:flex;flex-direction:column;gap:calc(var(--u) * 1.2)}

/* the scene */
.scene{position:relative;width:100%;aspect-ratio:16/9;border-radius:calc(var(--u) * 1.6);overflow:hidden;background:#e9e2d2;box-shadow:0 calc(var(--u)*1.2) calc(var(--u)*3) rgba(0,0,0,.5)}
.wall{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .28s ease}
.wall.on{opacity:1}
.scene.zoomed .wall.on,.scene.zoomed #hots{filter:blur(calc(var(--u)*.5)) brightness(.72) saturate(.85)}
#hots{position:absolute;inset:0;transition:filter .3s ease}
.wall{transition:opacity .28s ease, filter .3s ease}

/* tap targets: invisible, drawn on top of the picture */
.hs{position:absolute;background:transparent;border:0;padding:0;border-radius:calc(var(--u)*1);outline-offset:calc(var(--u)*-.6)}
.hs:focus-visible{outline:calc(var(--u)*.5) solid var(--accent)}
.hs.hidden{display:none}
.spark{position:absolute;width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);pointer-events:none;color:var(--accent);filter:drop-shadow(0 0 calc(var(--u)*.6) #fff2c8)}
.spark svg{width:100%;height:100%;display:block}
@media (prefers-reduced-motion:no-preference){
  .spark{animation:twinkle 2.4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.35;transform:scale(.85) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}
}

/* turn arrows, halfway up each side */
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:calc(var(--u)*6.5);height:calc(var(--u)*11);display:grid;place-items:center;background:none;border:0;color:#2b2d33;opacity:.85}
.arrow.l{left:calc(var(--u)*.4)} .arrow.r{right:calc(var(--u)*.4)}
.arrow svg{width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);filter:drop-shadow(0 0 calc(var(--u)*.5) rgba(255,255,255,.9))}
.arrow:focus-visible{outline:calc(var(--u)*.4) solid var(--accent);border-radius:999px}
.scene.zoomed .arrow,.scene.zoomed .msg{display:none}

/* corner controls */
.where{position:absolute;left:calc(var(--u)*1.6);top:calc(var(--u)*1.4);background:rgba(20,26,40,.78);color:#fffaf0;border-radius:999px;padding:calc(var(--u)*.55) calc(var(--u)*1.6);font-size:calc(var(--u)*1.9);font-family:Caprasimo,"Cooper Black",Georgia,serif;letter-spacing:.02em}
.ctl{position:absolute;top:calc(var(--u)*1.2);width:calc(var(--u)*6);height:calc(var(--u)*6);border-radius:50%;border:0;background:rgba(20,26,40,.78);color:#fffaf0;display:grid;place-items:center}
.ctl svg{width:60%;height:60%}
#hintBtn{right:calc(var(--u)*8.2)} #menuBtn{right:calc(var(--u)*1.4)}
.ctl:focus-visible{outline:calc(var(--u)*.4) solid var(--accent)}

/* the line the game speaks */
.msg{position:absolute;left:calc(var(--u)*9);right:calc(var(--u)*9);bottom:calc(var(--u)*1.6);margin:0;padding:calc(var(--u)*1) calc(var(--u)*1.8);
  background:rgba(20,26,40,.8);color:#fffaf0;border-radius:calc(var(--u)*1.2);font-size:calc(var(--u)*2);line-height:1.3;text-align:center;
  transition:opacity .25s;pointer-events:none}
.msg:empty{opacity:0}
.msg b{color:#f3c26a}

/* close-ups: the object comes forward, the room stays behind, softened */
.closeup{position:absolute;inset:0;display:grid;place-items:center;padding:calc(var(--u)*3) calc(var(--u)*10) calc(var(--u)*5.5);cursor:pointer}
.closeup .card{cursor:auto}
.closeup .stepback{position:absolute;left:0;right:0;bottom:calc(var(--u)*1.4);text-align:center;color:#fffaf0;opacity:.8;font-size:calc(var(--u)*1.8);pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.closeup .card{position:relative;max-width:100%;max-height:100%;background:var(--paper);color:var(--ink);border-radius:calc(var(--u)*1);
  box-shadow:0 calc(var(--u)*1.5) calc(var(--u)*4) rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.08);padding:calc(var(--u)*2.4) calc(var(--u)*3);overflow:hidden;
  transform-origin:center;animation:forward .28s ease-out}
@media (prefers-reduced-motion:reduce){.closeup .card{animation:none}}
@keyframes forward{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.card.note{font-family:Caveat,"Segoe Print",cursive;font-size:calc(var(--u)*2.7);line-height:1.22;display:flex;flex-direction:column;gap:calc(var(--u)*.8);width:calc(var(--u)*62)}
.card.note .head{font-weight:700;font-size:calc(var(--u)*3.4);color:#6d4fb8}
.card.note .big{font-size:calc(var(--u)*3.2);font-weight:700;color:#2f7c83}
.card.note.print{font-family:inherit;font-size:calc(var(--u)*2.2);line-height:1.35}
.card.note.print .head{font-family:Caprasimo,Georgia,serif;font-weight:400;font-size:calc(var(--u)*2.8);color:#2f7c83}
.card.tt{padding:calc(var(--u)*1.2);width:calc(var(--u)*60)} /* 60 wide keeps its 230:176 shape inside the scene's height */
.card.tt svg{display:block;width:100%;height:auto}
.back{position:absolute;right:calc(var(--u)*1.4);top:calc(var(--u)*1.2);width:calc(var(--u)*6);height:calc(var(--u)*6);border-radius:50%;border:0;background:rgba(20,26,40,.85);color:#fffaf0;display:grid;place-items:center;font-size:calc(var(--u)*3);z-index:2}
.back:focus-visible{outline:calc(var(--u)*.4) solid var(--accent)}

/* moving things are cut-outs on their own canvas layer, bent and swung in slices by script */
.layer{position:absolute;pointer-events:none;display:block}
.slot img{width:100%;height:100%;object-fit:contain;display:block}

#walls{position:absolute;inset:0}
.scene.fade #walls,.scene.fade #hots{opacity:0}
#walls,#hots{transition:opacity .35s ease, filter .3s ease}
/* a shelf of books, and a locker with three dials */
.card.shelf{width:calc(var(--u)*72);display:flex;flex-direction:column;gap:calc(var(--u)*1.2);align-items:stretch}
.card .otitle{margin:0;font-family:Caprasimo,Georgia,serif;font-size:calc(var(--u)*2.8);color:#2f7c83;text-align:center}
.books{display:flex;gap:calc(var(--u)*1);justify-content:center;align-items:flex-end;flex-wrap:wrap;padding:calc(var(--u)*1) 0 0;border-bottom:calc(var(--u)*.9) solid #a8744a}
.book{flex:1 1 0;min-width:calc(var(--u)*9);max-width:calc(var(--u)*13);min-height:calc(var(--u)*17);border:0;border-radius:calc(var(--u)*.6) calc(var(--u)*.6) 0 0;background:var(--sp,#3b78b8);color:#fffaf0;font:inherit;font-weight:700;font-size:calc(var(--u)*1.8);line-height:1.15;padding:calc(var(--u)*1) calc(var(--u)*.8);box-shadow:inset calc(var(--u)*-.5) 0 0 rgba(0,0,0,.18);cursor:pointer;text-wrap:balance}
.book.gap{background:#f7e9a8;color:#5b4a2e;font-family:Caveat,cursive;font-weight:500;font-size:calc(var(--u)*2);min-height:calc(var(--u)*12);align-self:flex-end;box-shadow:none;border-radius:calc(var(--u)*.4)}
.book:focus-visible{outline:calc(var(--u)*.4) solid var(--accent)}
.ofb{margin:0;min-height:calc(var(--u)*2.6);font-size:calc(var(--u)*2);text-align:center;color:var(--ink)}
.spell{margin:0;text-align:center;font-family:Caprasimo,Georgia,serif;font-size:calc(var(--u)*3.6);letter-spacing:.25em;color:#6d4fb8;min-height:calc(var(--u)*4)}
.row{display:flex;gap:calc(var(--u)*1.2);justify-content:center;flex-wrap:wrap}
.card.locker{width:calc(var(--u)*52);display:flex;flex-direction:column;gap:calc(var(--u)*1.4);align-items:center}
.dials{display:flex;gap:calc(var(--u)*2)}
.dial{width:calc(var(--u)*10);height:calc(var(--u)*13);border-radius:calc(var(--u)*1);border:0;background:#2b2836;color:#fffaf0;font-family:Caprasimo,Georgia,serif;font-size:calc(var(--u)*6);cursor:pointer;box-shadow:inset 0 calc(var(--u)*-.8) 0 rgba(0,0,0,.4), inset 0 calc(var(--u)*.6) 0 rgba(255,255,255,.12)}
.dial:focus-visible{outline:calc(var(--u)*.4) solid var(--accent)}
.card.locker .ob{min-height:44px}
.menu.end .card p{margin:0;max-width:calc(var(--u)*60)}

/* the inventory strip */
.inv{display:grid;grid-template-columns:repeat(10,1fr);gap:calc(var(--u)*1);padding:0 calc(var(--u)*.2)}
.slot{aspect-ratio:1/1;border-radius:calc(var(--u)*1.2);background:var(--slot);box-shadow:inset 0 0 0 calc(var(--u)*.22) var(--slot-line);border:0;padding:12%;display:grid;place-items:center}
.slot:empty{pointer-events:none}
.slot svg{width:100%;height:100%;display:block}
.slot.sel{box-shadow:inset 0 0 0 calc(var(--u)*.4) var(--accent);background:var(--accent-soft)}
.slot:focus-visible{outline:calc(var(--u)*.4) solid var(--accent)}

/* menu */
.menu{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,26,40,.55)}
.menu .card{background:var(--paper);border-radius:calc(var(--u)*1.4);padding:calc(var(--u)*3) calc(var(--u)*4);display:flex;flex-direction:column;gap:calc(var(--u)*1.4);align-items:center;font-size:calc(var(--u)*2.1);text-align:center;max-width:calc(var(--u)*70)}
.menu h2{font-family:Caprasimo,Georgia,serif;font-weight:400;margin:0;font-size:calc(var(--u)*3.6)}
.menu .small{color:var(--muted);font-size:calc(var(--u)*1.8)}
.ob{background:var(--ink);color:#fffaf0;border:0;border-radius:999px;padding:calc(var(--u)*1) calc(var(--u)*2.6);font-size:calc(var(--u)*2.1);min-height:44px}
.ob.quiet{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--slot-line)}

/* held in portrait: ask for a turn rather than squeezing the scene */
.rotate{display:none;position:fixed;inset:0;background:var(--bg);color:#fffaf0;place-items:center;text-align:center;padding:24px;font-size:1.2rem;line-height:1.4;z-index:9}
.rotate svg{width:72px;height:72px;margin-bottom:12px}
@media (orientation:portrait) and (max-width:820px){.rotate{display:grid}}
@media (prefers-reduced-motion:no-preference){.rotate svg{animation:turn 2.4s ease-in-out infinite}@keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#e9e2d2;color:var(--muted);font-size:calc(var(--u)*2.4)}
</style>
</head>
<body>
<div id="app">
<div class="stage" id="stage">
  <div class="scene" id="scene">
    <div class="loading" id="loading">Opening the school…</div>
    <div id="walls"></div>
    <div id="hots"></div>
    <button class="arrow l" id="left" aria-label="Turn left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="arrow r" id="right" aria-label="Turn right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="where" id="where">Classroom 5H</span>
    <button class="ctl" id="hintBtn" aria-label="Ask the moth for a hint" title="Hint"><svg viewBox="-14 -10 28 20" aria-hidden="true"><path d="M0 0C-4-9-13-9-13-2-13 3-5 3 0 0Z" fill="#f0b44c"/><path d="M0 0C4-9 13-9 13-2 13 3 5 3 0 0Z" fill="#f0b44c"/><path d="M0 1C-3 7-9 8-9 4-9 1-4 1 0 1Z" fill="#e9b98a"/><path d="M0 1C3 7 9 8 9 4 9 1 4 1 0 1Z" fill="#e9b98a"/><ellipse cx="0" cy="1" rx="1.3" ry="5" fill="#2b3431"/></svg></button>
    <button class="ctl" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
    <p class="msg" id="msg" aria-live="polite"></p>
    <div class="closeup" id="closeup" hidden></div>
    <div class="menu end" id="endUI" hidden>
      <div class="card">
        <h2>The last bell rings!</h2>
        <p id="endText"></p>
        <p class="small" id="endBonus"></p>
        <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"><button class="ob" id="endAgain">Play again</button></div>
      </div>
    </div>
    <div class="menu" id="menu" hidden>
      <div class="card">
        <h2>The Moth House</h2>
        <p>Mary's last day of school: the classroom, the corridor and the library.</p>
        <p class="small">This is a work of fiction. Its characters, schools and events are imaginary.</p>
        <p class="small" id="diag" style="font-family:monospace;font-size:calc(var(--u)*1.5)"></p>
        <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"><button class="ob quiet" id="soundBtn">Sound: on</button><button class="ob quiet" id="restart">Start again</button><button class="ob" id="closeMenu">Back to the room</button></div>
      </div>
    </div>
  </div>
  <div class="inv" id="inv" aria-label="Things you are carrying"></div>
</div>
</div>
<div class="rotate"><div><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2" fill="none" stroke="#fffaf0" stroke-width="1.6"/><circle cx="12" cy="18.5" r="1" fill="#fffaf0"/></svg><br>Turn your phone sideways to play.</div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-pe" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 3.6l2.2 1.6-.8 2.6H4.6l-.8-2.6Z" fill="currentColor"/><path d="M6 1v2.6M1.2 5.2l2.6 0M10.8 5.2l-2.6 0M3.2 10.4l1.4-2.6M8.8 10.4 7.4 7.8" stroke="currentColor" stroke-width="1"/></symbol>
    <symbol id="i-sc" viewBox="0 0 12 12"><path d="M4.5 1h3M5 1v3.5L2 10a1 1 0 0 0 .9 1.5h6.2A1 1 0 0 0 10 10L7 4.5V1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M3.4 8.5h5.2L9.3 10.3H2.7Z" fill="currentColor"/></symbol>
    <symbol id="i-ma" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 3v6M3 6h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-en" viewBox="0 0 12 12"><path d="M2.5 9.5 3.5 6.5 8.5 1.5l2 2-5 5Z" fill="currentColor"/><path d="M2.5 9.5l1-3 2 2Z" fill="#fffdf6"/></symbol>
    <symbol id="i-ge" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.3"/><ellipse cx="6" cy="6" rx="2.2" ry="5" fill="none" stroke="currentColor" stroke-width="1"/><path d="M1 6h10" stroke="currentColor" stroke-width="1"/></symbol>
    <symbol id="i-li" viewBox="0 0 12 12"><rect x="1.5" y="8" width="9" height="2.6" rx=".6" fill="currentColor"/><rect x="2.5" y="4.8" width="8" height="2.6" rx=".6" fill="currentColor" opacity=".75"/><rect x="1.8" y="1.6" width="7" height="2.6" rx=".6" fill="currentColor" opacity=".5"/></symbol>
    <symbol id="i-mu" viewBox="0 0 12 12"><path d="M4.5 9.5V2.5l5-1.2v6.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="3" cy="9.5" r="1.7" fill="currentColor"/><circle cx="8" cy="8" r="1.7" fill="currentColor"/></symbol>
    <symbol id="i-ar" viewBox="0 0 12 12"><path d="M1.5 10.5c0-2 1-3 2.5-3.5L9.5 1.5l1 1L5 8c-.5 1.5-1.5 2.5-3.5 2.5Z" fill="currentColor"/></symbol>
  </defs>
</svg>

<script>
'use strict';
const BUILD = '2026-09-28p';
const $ = id => document.getElementById(id);

/* ---------- sizing: the scene fills the screen in landscape, inventory strip under it ---------- */
function fit(){
  const vw = innerWidth - 16, vh = innerHeight - 12;
  const w = Math.min(vw, vh / 0.6725, 1400);   /* scene 9/16 tall plus the strip and gap */
  document.documentElement.style.setProperty('--u', (w / 100) + 'px');
}
addEventListener('resize', fit); fit();

/* ---------- rooms: each is a box, its views in turning order; a door names the room and the view you arrive facing ---------- */
const ROOMS = {
  classroom:{name:'Classroom 5H', into:'your classroom', views:['c1','c2','c3','c4']},
  corridor:{name:'Corridor', into:'the corridor', views:['h1','h2','h3','h4']},
  library:{name:'Library', into:'the library', views:['l1','l2','l3','l4','l5','l6']}
};
const WALLS = {
  c1:'../art/classroom/landscape-c1-front-whiteboard.jpg', c2:'../art/classroom/landscape-c2-window.jpg', c3:'../art/classroom/landscape-c3-door.jpg', c4:'../art/classroom/landscape-c4-timetable-desk.jpg',
  /* placeholder walls until the corridor and library art is generated (see PLAYBOOK.md) */
  h1:'../art/school/placeholder-h1.jpg', h2:'../art/school/placeholder-h2.jpg', h3:'../art/school/placeholder-h3.jpg', h4:'../art/school/placeholder-h4.jpg',
  l1:'../art/school/placeholder-l1.jpg', l2:'../art/school/placeholder-l2.jpg', l3:'../art/school/placeholder-l3.jpg', l4:'../art/school/placeholder-l4.jpg', l5:'../art/school/placeholder-l5.jpg', l6:'../art/school/placeholder-l6.jpg'
};
/* door hotspot -> [room, index of the view you arrive facing (away from the door you came through)] */
const DOORS = {door:['corridor', 1], h_door5H:['classroom', 0], h_libdoors:['library', 2], l_doors:['corridor', 3]};
/* The corridor and library open only when their art is in, or with ?rooms in the address for testing. */
const OPEN_DOORS = new URLSearchParams(location.search).has('rooms') || false;
const HOTS = {
  c1:[
    {id:'cupboard', l:8, t:34, w:20, h:54, label:'Supplies cupboard', anim:'peek', layer:'doors', sound:'knock'},
    {id:'mug', l:70.5, t:61.5, w:6.5, h:9.5, label:"Mr Hollis's mug", anim:'wobble', layer:'mug', sound:'tap'},
    {id:'board', l:32, t:34, w:37, h:37, label:'Whiteboard', sound:'tap'},
    {id:'apple', l:87.5, t:57.5, w:6.5, h:8.5, label:'Apple on the books', anim:'wobble', layer:'apple', sound:'tap'},
    {id:'tdesk', l:71, t:62, w:24, h:27, label:"Mr Hollis's desk", sound:'tap'}],
  c2:[
    {id:'window', l:30, t:17, w:40, h:31, label:'Classroom window', sound:'tap'},
    {id:'beans', l:33, t:30, w:35, h:37, label:'Bean plants on the window sill', anim:'bend', layer:'plant', sound:'leaf'},
    {id:'radiator', l:36, t:71, w:28, h:19, label:'Radiator', sound:'knock'}],
  c3:[
    {id:'bin', l:27, t:69, w:11, h:23, label:'Recycling bin', anim:'flip', layer:'lid', sound:'knock'},
    {id:'door', l:40, t:26.5, w:20.5, h:66, label:'Door to the corridor', sound:'knock'},
    {id:'pegs', l:61, t:46, w:29, h:36, label:'Coat pegs', anim:'swing', layer:'coat', sound:'leaf'},
    {id:'lost', l:74.5, t:73, w:15.5, h:21, label:'Lost property box', anim:'pop', layer:'lost', sound:'paper'}],
  c4:[
    {id:'rules', l:26, t:30, w:8.5, h:18, label:'Class rules', sound:'paper'},
    {id:'timetable', l:38.5, t:25, w:23, h:30, label:'Class timetable', sound:'paper'},
    {id:'clock', l:67, t:23, w:8.5, h:16, label:'Clock', sound:'tick'},
    {id:'bookshelf', l:21, t:59, w:17.5, h:29, label:'Bookshelf', sound:'knock'},

/* ---------- state ---------- */
const KEY = 'mothhouse.landscape.' + BUILD; /* each build starts a fresh game; Start again is in the menu */
let S;
function fresh(){ return {room:'classroom', view:3, got:[], hint:{}, opened:false, bonus:false, spell:'', nightMoth:false, dials:[0,0,0], done:false}; }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.got) && ROOMS[s.room]) return Object.assign(fresh(), s); }catch(e){} return fresh(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const curView = () => ROOMS[S.room].views[S.view];

/* ---------- drawing ---------- */
function say(html){ $('msg').innerHTML = html; }
function render(){
  const v = curView();
  Object.keys(WALLS).forEach(k => $('w-'+k).classList.toggle('on', k === v));
  $('where').textContent = ROOMS[S.room].name;
  const hots = $('hots'); hots.innerHTML = '';
  layerState.clear();
  (LAYERS[v] || []).forEach(L => { if (L.hideWhen && L.hideWhen()) return; if (L.showWhen && !L.showWhen()) return; hots.appendChild(makeLayer(L)); });
  if (v === 'c4') hots.appendChild(wallTimetable());
  /* bigger targets first, so a small thing on a big thing (the mug on the desk) stays tappable */
  [...HOTS[v]].sort((a, b) => b.w*b.h - a.w*a.h).forEach(h => {
    if (h.hideWhen && h.hideWhen()) return;
    const b = document.createElement('button');
    b.className = 'hs'; b.dataset.id = h.id; b.setAttribute('aria-label', h.label);
    b.style.cssText = `left:${h.l}%;top:${h.t}%;width:${h.w}%;height:${h.h}%`;
    b.onclick = () => { animate(h); sfx(h.sound || 'tap'); act(h.id); };
    hots.appendChild(b);
    if (h.key && sparkle(h.id)){
      const s = document.createElement('span'); s.className = 'spark';
      s.style.cssText = `left:${h.l + h.w - 1.5}%;top:${h.t - 1.5}%`;
      s.innerHTML = '<svg viewBox="0 0 10 10"><path d="M5 0 6 4 10 5 6 6 5 10 4 6 0 5 4 4Z" fill="currentColor"/></svg>';
      hots.appendChild(s);
    }
  });
  const inv = $('inv'); inv.innerHTML = '';
  for (let i = 0; i < 10; i++){
    const key = S.got[i];
    const b = document.createElement('button'); b.className = 'slot';
    if (key){ b.innerHTML = ITEMS[key].icon.replace('.png"', '.png?v=' + BUILD + '"'); b.setAttribute('aria-label', ITEMS[key].name); b.onclick = () => { sfx('paper'); openNote(ITEMS[key].note); }; }
    else b.setAttribute('aria-hidden', 'true');

/* the key thing sparkles only while it is the next thing to do */
function sparkle(id){
  if (id === 'envelope') return !S.got.includes('envelope');
  if (id === 'h_locker') return S.got.includes('slipAr') && !S.done;

}

function ttGrid(x0, y0, dayW, cw, rh, ic, fs){

    const y = y0 + fs + 4 + r*rh;
    out += `<rect x="${x0}" y="${y}" width="${dayW+cw*6}" height="${rh}" fill="${r%2?'#eef3ee':'#f7f9f3'}" stroke="#cfc8b4" stroke-width=".6"/>`;
    out += `<text x="${x0+4}" y="${y+rh/2+fs*.36}" font-size="${fs}" font-weight="700" fill="#2b2836" font-family="Atkinson Hyperlegible,Verdana,sans-serif">${d}</text>`;
    row.forEach((c,i) => { const [id,col] = SUBJECT[c]; out += `<use href="#${id}" x="${x0+dayW+cw*i+(cw-ic)/2}" y="${y+(rh-ic)/2}" width="${ic}" height="${ic}" style="color:${col}"/>`; });

}

let shelfKey = null;
function openShelf(key){

}
function pickBook(i){
  const sh = SHELVES[shelfKey], [title, what] = sh.books[i], fb = $('shelfFb');
  sfx('paper');

  if (shelfKey === 'sto' && S.bonus && !S.nightMoth){
    S.spell += title[0]; $('spell').textContent = S.spell.split('').join(' ');
    if (S.spell.length === 4){
      if (S.spell === 'NANA'){ S.nightMoth = true; fb.textContent = 'NANA! Nana loves postcards and moths. You are a super-sleuth.'; sfx('pickup'); say('★ Bonus riddle solved: NANA.'); }

function hint(){

/* ---------- sound: small effects and a gentle music-box background, all made in the browser ---------- */
const SOUND_KEY = 'mothhouse.sound';
let soundOn = true; try{ soundOn = localStorage.getItem(SOUND_KEY) !== 'off'; }catch(e){}
let AC = null, music = null;
function audio(){

function env(gainNode, t, a, peak, d){ const g = gainNode.gain; g.cancelScheduledValues(t); g.setValueAtTime(0.0001, t); g.exponentialRampToValueAtTime(peak, t + a); g.exponentialRampToValueAtTime(0.0001, t + a + d); }

  o.connect(g); g.connect(ac.destination); env(g, t, a, peak, d); o.start(t); o.stop(t + a + d + .05);
}
function noise(peak, a, d, freq, q, t0){

  const buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(); src.buffer = buf; const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain(); src.connect(f); f.connect(g); g.connect(ac.destination); env(g, t, a, peak, d); src.start(t); src.stop(t + a + d + .05);
}
function sfx(kind){

  switch(kind){
    case 'tap': tone(520, 'sine', .3, .005, .12); break;
    case 'knock': noise(.4, .004, .12, 400, 1.2); tone(220, 'sine', .25, .004, .1); break;
    case 'paper': noise(.35, .02, .2, 2600, .9); noise(.2, .08, .18, 1400, 1, t + .06); break;
    case 'leaf': noise(.25, .04, .35, 3200, .8); break;
    case 'tick': tone(1800, 'square', .1, .003, .04); tone(1400, 'square', .1, .003, .04, t + .16); break;
    case 'squeak': tone(1300, 'triangle', .2, .02, .1); tone(1700, 'triangle', .18, .02, .12, t + .1); break;
    case 'turn': noise(.2, .06, .25, 900, .7); break;
    case 'open': tone(660, 'sine', .22, .01, .14); tone(990, 'sine', .2, .01, .18, t + .07); break;
    case 'close': tone(880, 'sine', .2, .01, .12); tone(590, 'sine', .2, .01, .16, t + .07); break;
    case 'pickup': [659, 784, 1047].forEach((f, i) => tone(f, 'triangle', .25, .01, .35, t + i * .09)); break;

}
/* Background music: a composed sixteen-bar music-box waltz, played by a scheduler and looped.
   To use a recorded track instead, set TRACK to its file (an mp3 that loops cleanly) and the tune below is not used. */
const TRACK = '../art/music/classroom.mp3'; /* made with Google's Lyria through the Gemini key; see art/music/README.md */
const TEMPO = 84, BEATS_PER_BAR = 3;
const TUNE = {
  bars: ['C','Am','F','G','C','Am','F','G','Am','F','C','G','F','G','C','C'],
  chords: {C:{bass:48, tones:[64,67]}, Am:{bass:45, tones:[60,64]}, F:{bass:53, tones:[60,65]}, G:{bass:55, tones:[62,67]}},
  melody: [ /* [bar, beat, length in beats, midi note] */
    [0,0,1,64],[0,1,1,67],[0,2,1,69],  [1,0,2,67],[1,2,1,64],  [2,0,1,65],[2,1,1,69],[2,2,1,72],  [3,0,2,71],[3,2,1,67],
    [4,0,1,72],[4,1,.5,71],[4,1.5,.5,69],[4,2,1,67],  [5,0,1,69],[5,1,1,72],[5,2,1,76],  [6,0,2,74],[6,2,1,72],  [7,0,3,71],
    [8,0,1,69],[8,1,1,71],[8,2,1,72],  [9,0,2,69],[9,2,1,65],  [10,0,1,67],[10,1,1,64],[10,2,1,60],  [11,0,2,62],[11,2,1,64],
    [12,0,1,65],[12,1,1,69],[12,2,1,72],  [13,0,1,74],[13,1,1,71],[13,2,1,67],  [14,0,2,72],[14,2,1,67],  [15,0,3,72]]
};
const hz = m => 440*Math.pow(2, (m-69)/12);
let musicBus = null;
function musicGraph(){
  const ac = AC, master = ac.createGain(); master.gain.value = 0.0001;
  /* a soft room: a short synthetic reverb, mixed in behind the dry sound */
  const conv = ac.createConvolver(), len = ac.sampleRate*1.8, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++){ const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 2.6); }
  conv.buffer = ir; const wet = ac.createGain(); wet.gain.value = .45; const dry = ac.createGain(); dry.gain.value = .8;
  const inBus = ac.createGain(); inBus.connect(dry); inBus.connect(conv); conv.connect(wet); dry.connect(master); wet.connect(master); master.connect(ac.destination);
  return {inBus, master};
}
/* a music-box note: a bright ping that rings and fades */
function musicBox(midi, t, dur, vol){
  const ac = AC, f = hz(midi), g = ac.createGain(); g.connect(musicBus.inBus);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(vol*0.35, t + 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, 0.9) + 0.6);
  [[1, 1], [2, .35], [3, .12], [5.4, .05]].forEach(([k, a]) => { const o = ac.createOscillator(), og = ac.createGain(); o.type = 'sine'; o.frequency.value = f*k; og.gain.value = a; o.connect(og); og.connect(g); o.start(t); o.stop(t + Math.max(dur, 0.9) + 0.7); });
}
function softNote(midi, t, dur, vol, type){
  const ac = AC, o = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter(); o.type = type || 'triangle'; o.frequency.value = hz(midi);
  fl.type = 'lowpass'; fl.frequency.value = 900; o.connect(fl); fl.connect(g); g.connect(musicBus.inBus);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.05);
}
function startMusic(){
  if (music || !soundOn || !audio()) return;
  if (TRACK){
    /* A recorded track needs a real tap before the browser lets it play. If this attempt is refused,
       nothing is kept, so the next tap tries again; once it plays, it stays. */
    if (!trackEl){ trackEl = new Audio(TRACK + '?v=' + BUILD); trackEl.loop = true; trackEl.volume = .5; trackEl.preload = 'auto';
      trackEl.onerror = () => { musicState = 'file failed, using the built-in tune'; trackEl = null; music = null; startTune(); }; }
    if (musicState === 'starting') return;
    musicState = 'starting';
    trackEl.play().then(() => { musicState = 'playing'; music = {stop(){ trackEl.pause(); musicState = 'off'; }}; })
      .catch(err => { musicState = 'blocked until a tap (' + (err && err.name) + ')'; music = null; });
    return;
  }
  startTune();
}
let trackEl = null, musicState = 'not started';
function startTune(){
  if (music || !soundOn || !audio()) return;
  musicState = 'built-in tune';
  const ac = AC; musicBus = musicGraph();
  musicBus.master.gain.exponentialRampToValueAtTime(1, ac.currentTime + 2.5);
  const beat = 60/TEMPO, loopBeats = TUNE.bars.length*BEATS_PER_BAR, start = ac.currentTime + 0.3;
  let nextBeat = 0;
  const schedule = () => {
    while (start + nextBeat*beat < ac.currentTime + 0.6){
      const b = nextBeat % loopBeats, bar = Math.floor(b/BEATS_PER_BAR), inBar = b % BEATS_PER_BAR, t = start + nextBeat*beat, ch = TUNE.chords[TUNE.bars[bar]];
      if (inBar === 0) softNote(ch.bass, t, beat*2.6, .16);
      else ch.tones.forEach((m, i) => musicBox(m, t + i*0.012, beat, .045));
      TUNE.melody.filter(n => n[0] === bar && Math.floor(n[1]) === inBar).forEach(n => musicBox(n[3], t + (n[1]-inBar)*beat, n[2]*beat, .19));
      nextBeat++;
    }
  };
  schedule(); const timer = setInterval(() => { if (ac.state === 'running') schedule(); }, 120);
  music = {stop(){ clearInterval(timer); const g = musicBus.master.gain; g.cancelScheduledValues(ac.currentTime); g.setValueAtTime(g.value, ac.currentTime); g.exponentialRampToValueAtTime(.0001, ac.currentTime + .8); setTimeout(() => musicBus.master.disconnect(), 900); }};
}
function stopMusic(){ if (music){ music.stop(); music = null; } }
function setSound(on){
  soundOn = on; try{ localStorage.setItem(SOUND_KEY, on ? 'on' : 'off'); }catch(e){}
  $('soundBtn').textContent = 'Sound: ' + (on ? 'on' : 'off');
  if (on){ audio() && AC.resume(); startMusic(); } else stopMusic();
}
/* Browsers only allow sound after the player has tapped, so the first tap anywhere wakes it. */
function wake(){ if (!soundOn) return; audio(); if (AC && AC.state !== 'running') AC.resume(); startMusic(); }
['touchend','click'].forEach(ev => addEventListener(ev, wake, {passive:true})); addEventListener('keydown', wake);
document.addEventListener('visibilitychange', () => { if (!AC) return; if (document.hidden) AC.suspend(); else if (soundOn) AC.resume(); });

/* ---------- wiring ---------- */
$('left').onclick = () => turn(-1); $('right').onclick = () => turn(1);
$('hintBtn').onclick = hint;
$('menuBtn').onclick = () => { closeCloseup(); $('menu').hidden = false; $('diag').textContent = `build ${BUILD} · sound: ${AC ? AC.state : 'not started'} · music: ${musicState} · reduced motion: ${matchMedia('(prefers-reduced-motion:reduce)').matches ? 'ON (gentle taps)' : 'off'} · ${innerWidth}×${innerHeight} · ${navigator.userAgent.replace(/^.*\((.*?)\).*$/, '$1').slice(0, 40)}`; };
$('closeMenu').onclick = () => { $('menu').hidden = true; };
$('soundBtn').onclick = () => setSound(!soundOn);
$('soundBtn').textContent = 'Sound: ' + (soundOn ? 'on' : 'off');
const INTRO = '<b>Last day of school.</b> Everyone is at the party, but Mr Hollis left something on your desk. Nutmeg knows something.';
const restart = () => { S = fresh(); $('menu').hidden = true; $('endUI').hidden = true; closeCloseup(); render(); say(INTRO); };
$('restart').onclick = restart; $('endAgain').onclick = restart;
$('app').addEventListener('click', e => { if (e.target === $('app')) closeCloseup(); }); /* a tap on the dark margin also steps back */
addEventListener('keydown', e => { if (e.key === 'ArrowLeft') turn(-1); if (e.key === 'ArrowRight') turn(1); if (e.key === 'Escape'){ closeCloseup(); $('menu').hidden = true; } });

S = load();
Promise.all(roomArt(S.room).map(preload)).then(() => {
  $('loading').remove();
  render();
  say(S.got.length ? `Back in ${ROOMS[S.room].into}.` : INTRO);
  /* the other rooms load quietly in the background */
  Object.keys(ROOMS).filter(r => r !== S.room).forEach(r => roomArt(r).forEach(preload));
});
</script>
